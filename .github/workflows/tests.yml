name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        # Docker is preinstalled on ubuntu-latest runners, so the sandbox
        # integration tests (tests/test_sandbox.py) run for real here, not
        # just unit-level. The one test needing a pre-pulled multi-GB
        # SWE-bench image is skipped automatically — it isn't pulled in CI.
